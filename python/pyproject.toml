[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apihorseracing"
version = "1.0.0"
description = "Official Python client for the Horse Racing API: results, form, starting prices and price movement back to 2017."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["horse racing", "racing", "api", "results", "form", "starting prices", "sports data"]
dependencies = []

[project.urls]
Homepage = "https://apihorseracing.com"
Documentation = "https://apihorseracing.com/documentation"
Source = "https://github.com/apihorseracing/sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["apihorseracing*"]
